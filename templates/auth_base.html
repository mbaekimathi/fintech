{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1f2a">
  <title>{% block title %}Sign in{% endblock %} · {{ product_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,560;9..144,680&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-body">
  <div class="auth-grid">
    <aside class="auth-brand">
      <div class="auth-brand-inner">
        <p class="mark">{{ product_name }}</p>
        <h1>Staff workspace</h1>
        <p class="lede">Paybill, people, and connected systems.</p>
      </div>
    </aside>
    <section class="auth-panel">
      {% include "partials/messages.html" %}
      {% block content %}{% endblock %}
    </section>
  </div>
  <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
