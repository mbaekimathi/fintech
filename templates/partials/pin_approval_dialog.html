<div
  class="detail-backdrop approval-backdrop pin-approval-backdrop"
  data-pin-approval-backdrop
  hidden
  role="presentation"
>
  <div
    class="detail-dialog approval-dialog pin-approval-dialog modal-vivid"
    role="dialog"
    aria-modal="true"
    aria-labelledby="pin-approval-title"
    data-pin-approval-dialog
  >
    <div class="modal-chrome" aria-hidden="true">
      <span class="modal-chrome__orb modal-chrome__orb--a"></span>
      <span class="modal-chrome__orb modal-chrome__orb--b"></span>
      <span class="modal-chrome__orb modal-chrome__orb--c"></span>
      <span class="modal-chrome__stripe"></span>
    </div>
    <div class="modal-chrome-content">
    <header class="approval-dialog__head">
      <div class="approval-dialog__brand">
        <span class="approval-dialog__badge approval-dialog__badge--app" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
          </svg>
          App approval
        </span>
        <button type="button" class="approval-dialog__close btn btn-ghost btn-small" data-pin-approval-cancel aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <h2 id="pin-approval-title" class="approval-dialog__title">Enter your approval password</h2>
      <p class="approval-dialog__subtitle">Your 6-digit password confirms this payout before it is sent.</p>
    </header>

    <div class="approval-dialog__hero approval-dialog__hero--lock" aria-hidden="true">
      <div class="approval-hero-ring approval-hero-ring--outer approval-hero-ring--violet"></div>
      <div class="approval-hero-icon approval-hero-icon--lock">
        <svg viewBox="0 0 48 48" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="14" y="22" width="20" height="18" rx="3"/>
          <path d="M18 22v-6a6 6 0 0 1 12 0v6"/>
        </svg>
      </div>
    </div>

    <div class="approval-summary-card" data-pin-approval-detail-wrap hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/>
      </svg>
      <p class="approval-summary-card__text" data-pin-approval-detail></p>
    </div>

    <p class="approval-alert approval-alert--warn" data-pin-approval-setup hidden>
      Set your 6-digit approval password on
      <a href="{% url 'accounts:profile' %}">Profile</a>
      before you can approve payments.
    </p>
    <p class="approval-alert approval-alert--warn" data-pin-approval-phone-setup hidden>
      Add your phone number on
      <a href="{% url 'accounts:profile' %}">Profile</a>
      to approve with an M-Pesa STK prompt.
    </p>

    <label class="approval-pin-field label">
      <span class="approval-pin-field__label">Approval password</span>
      <div class="approval-pin-field__wrap">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="7" cy="12" r="1.5" fill="currentColor"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
          <circle cx="17" cy="12" r="1.5" fill="currentColor"/>
        </svg>
        <input
          type="password"
          class="pin-field approval-pin-input"
          inputmode="numeric"
          autocomplete="current-password"
          maxlength="6"
          pattern="\d{6}"
          placeholder="••••••"
          aria-label="6-digit approval password"
          data-pin-approval-input
        >
      </div>
    </label>
    <p class="approval-alert approval-alert--error" data-pin-approval-error hidden>Enter your 6-digit approval password.</p>

    <footer class="approval-dialog__foot">
      <button type="button" class="btn btn-ghost approval-btn-alt" data-pin-approval-use-stk hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="7" y="2" width="10" height="20" rx="2"/>
          <circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/>
        </svg>
        Use M-Pesa PIN on my phone
      </button>
      <button type="button" class="btn btn-primary approval-btn-primary" data-pin-approval-submit>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12l5 5L20 7"/>
        </svg>
        Approve &amp; send
      </button>
    </footer>
    </div>
  </div>
</div>
