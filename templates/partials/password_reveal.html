<div
  class="password-reveal"
  data-password-reveal
  data-action="{{ reveal_action }}"
  x-data="{ visible: false, pin: '', error: '', checking: false }"
>
  <div x-show="!visible">
    <span class="mono muted">••••••</span>
    <div class="password-reveal-entry">
      <span class="password-field">
        <input
          type="password"
          class="pin-field"
          maxlength="6"
          inputmode="numeric"
          autocomplete="current-password"
          placeholder="Enter current password"
          aria-label="Enter current password to view"
          x-model="pin"
          @input="pin = pin.replace(/\D/g, '').slice(0, 6); error = ''"
          @keydown.enter.prevent="$refs.viewBtn?.click()"
        >
        {% include "partials/password_toggle.html" %}
      </span>
      <button
        type="button"
        class="btn btn-ghost btn-small"
        x-ref="viewBtn"
        :disabled="pin.length !== 6 || checking"
        @click="
          checking = true;
          error = '';
          const csrf = document.querySelector('input[name=csrfmiddlewaretoken]')?.value || '';
          const body = new URLSearchParams({ action: $el.closest('[data-password-reveal]').dataset.action, password: pin, csrfmiddlewaretoken: csrf });
          fetch(window.location.pathname, {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest', 'Content-Type': 'application/x-www-form-urlencoded' },
            credentials: 'same-origin',
            body,
          })
            .then((r) => r.json().then((data) => ({ ok: r.ok, data })))
            .then(({ ok, data }) => {
              if (ok && data.ok) {
                pin = data.password || pin;
                visible = true;
                return;
              }
              error = data.detail || 'Could not verify password.';
            })
            .catch(() => { error = 'Could not reach the server.'; })
            .finally(() => { checking = false; });
        "
      >
        <span x-show="!checking">View</span>
        <span x-show="checking" x-cloak>Checking…</span>
      </button>
    </div>
    <p class="field-error" x-show="error" x-text="error" x-cloak></p>
    <p class="field-hint">Enter your current password and tap View. It is shown only on this screen.</p>
  </div>
  <div x-show="visible" x-cloak class="password-reveal-shown">
    <span class="password-field">
      <input type="text" class="pin-field mono" readonly :value="pin" aria-label="Your password">
      {% include "partials/password_toggle.html" with visible=True %}
    </span>
    <button type="button" class="btn btn-ghost btn-small" @click="visible = false; pin = ''">Hide</button>
  </div>
</div>
