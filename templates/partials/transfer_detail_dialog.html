{# Alpine: parent must define transferDetail and listen for open-transfer-detail #}
<div
  class="detail-backdrop transfer-detail-backdrop"
  x-show="transferDetail"
  x-cloak
  x-transition:enter="transfer-detail-enter"
  x-transition:enter-start="transfer-detail-enter-start"
  x-transition:enter-end="transfer-detail-enter-end"
  x-transition:leave="transfer-detail-leave"
  x-transition:leave-start="transfer-detail-leave-start"
  x-transition:leave-end="transfer-detail-leave-end"
  @click.self="transferDetail = null"
  role="presentation"
>
  <div
    class="detail-dialog transfer-detail-dialog modal-simple"
    role="dialog"
    aria-modal="true"
    aria-labelledby="transfer-detail-title"
    @click.stop
    x-show="transferDetail"
    x-transition:enter="transfer-detail-panel-enter"
    x-transition:enter-start="transfer-detail-panel-enter-start"
    x-transition:enter-end="transfer-detail-panel-enter-end"
  >
    <template x-if="transferDetail">
      <div class="transfer-detail-shell">
        <header class="transfer-detail__head approval-dialog__head--compact">
          <div class="approval-dialog__headline-row">
            <h2 id="transfer-detail-title" class="transfer-detail__title">Transfer details</h2>
            <span
              class="badge transfer-detail__status"
              :class="'badge-' + (transferDetail.statusBadge || 'pending')"
              x-show="transferDetail.status"
              x-text="transferDetail.status"
            ></span>
            <button type="button" class="approval-dialog__close btn btn-ghost btn-small" @click="transferDetail = null" aria-label="Close">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 6l12 12M18 6L6 18"/>
              </svg>
            </button>
          </div>
          <p
            class="transfer-detail__lead muted"
            x-show="transferDetail.category || transferDetail.title"
            x-text="transferDetail.category || transferDetail.title"
          ></p>
        </header>

        <div class="approval-request-detail transfer-detail-panel">
          <dl class="approval-request-detail__grid">
            <div class="approval-request-detail__row approval-request-detail__row--split" x-show="transferDetail.amount">
              <div>
                <dt>Amount</dt>
                <dd class="approval-request-detail__amount" x-text="transferDetail.amount"></dd>
              </div>
              <div x-show="transferDetail.when">
                <dt>When</dt>
                <dd x-text="transferDetail.when"></dd>
              </div>
            </div>
            <div class="approval-request-detail__row" x-show="transferDetail.destination">
              <dt>To</dt>
              <dd x-text="transferDetail.destination"></dd>
            </div>
            <div class="approval-request-detail__row" x-show="transferDetail.source">
              <dt>From</dt>
              <dd x-text="transferDetail.source"></dd>
            </div>
            <div class="approval-request-detail__row" x-show="transferDetail.initiator">
              <dt>Initiator</dt>
              <dd>
                <span x-text="transferDetail.initiator"></span>
                <span class="muted" x-show="transferDetail.initiatorCode" x-text="' · ' + transferDetail.initiatorCode"></span>
              </dd>
            </div>
            <div class="approval-request-detail__row" x-show="transferDetail.reference">
              <dt>Reference</dt>
              <dd class="mono" x-text="transferDetail.reference"></dd>
            </div>
            <div class="approval-request-detail__row" x-show="transferDetail.mpesaReference">
              <dt>M-Pesa reference</dt>
              <dd class="mono" x-text="transferDetail.mpesaReference"></dd>
            </div>
            <div class="approval-request-detail__row" x-show="transferDetail.reason">
              <dt>Reason</dt>
              <dd x-text="transferDetail.reason"></dd>
            </div>
          </dl>
        </div>

        <footer class="transfer-detail__foot">
          <button type="button" class="btn btn-primary approval-btn-primary transfer-detail-done" @click="transferDetail = null">Done</button>
        </footer>
      </div>
    </template>
  </div>
</div>
