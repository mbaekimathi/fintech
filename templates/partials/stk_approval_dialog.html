<div
  class="detail-backdrop approval-backdrop stk-approval-backdrop"
  data-stk-approval-backdrop
  hidden
  role="presentation"
>
  <div
    class="detail-dialog approval-dialog stk-approval-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="stk-approval-title"
    aria-describedby="stk-approval-message"
    data-stk-approval-dialog
    data-approval-state="idle"
  >
    <header class="approval-dialog__head">
      <div class="approval-dialog__brand">
        <span class="approval-dialog__badge approval-dialog__badge--mpesa" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="7" y="2" width="10" height="20" rx="2"/>
            <circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/>
          </svg>
          M-Pesa
        </span>
        <button type="button" class="approval-dialog__close btn btn-ghost btn-small" data-stk-approval-cancel aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <h2 id="stk-approval-title" class="approval-dialog__title">Check your phone</h2>
      <p class="approval-dialog__subtitle" id="stk-approval-message" data-stk-approval-message>
        An STK prompt was sent to your phone. Enter your M-Pesa PIN to approve this payment.
      </p>
    </header>

    <div class="approval-dialog__hero" aria-hidden="true">
      <div class="approval-hero-ring approval-hero-ring--outer"></div>
      <div class="approval-hero-ring approval-hero-ring--inner"></div>
      <div class="approval-hero-icon">
        <svg class="approval-icon-phone" viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="14" y="4" width="20" height="40" rx="4"/>
          <path d="M20 38h8"/>
          <path class="approval-icon-signal" d="M24 14v8M24 26h.01"/>
        </svg>
      </div>
    </div>

    <div class="approval-summary-card" data-stk-approval-detail-wrap hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      <p class="approval-summary-card__text" data-stk-approval-detail></p>
    </div>

    <div class="approval-status" role="status" aria-live="polite" aria-atomic="true">
      <span class="approval-status__dot" aria-hidden="true"></span>
      <div class="approval-status__copy">
        <span class="approval-live-pill" data-stk-approval-live hidden>
          <span class="approval-live-pill__dot" aria-hidden="true"></span>
          Live
        </span>
        <strong class="approval-status__headline" data-stk-approval-headline>Waiting for M-Pesa…</strong>
        <span class="approval-status__label" data-stk-approval-status>We check Safaricom every few seconds.</span>
      </div>
    </div>

    <div class="approval-outcome approval-outcome--success" data-stk-approval-outcome-success hidden role="status">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M8 12l3 3 5-6"/>
      </svg>
      <div>
        <strong>Approved</strong>
        <p data-stk-approval-success-reason></p>
      </div>
    </div>

    <div class="approval-outcome approval-outcome--fail" data-stk-approval-outcome-fail hidden role="alert">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <path d="M15 9l-6 6M9 9l6 6"/>
      </svg>
      <div>
        <strong>Not approved</strong>
        <p data-stk-approval-fail-reason></p>
      </div>
    </div>

    <div class="approval-alert approval-alert--error" data-stk-approval-error hidden role="alert"></div>

    <footer class="approval-dialog__foot">
      <button type="button" class="btn btn-ghost" data-stk-approval-retry hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 4v6h6M20 20v-6h-6"/>
          <path d="M20 9a8 8 0 0 0-14.9-3M4 15a8 8 0 0 0 14.9 3"/>
        </svg>
        Send STK again
      </button>
      <button type="button" class="btn btn-ghost approval-btn-alt" data-stk-approval-use-app hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="11" width="14" height="10" rx="2"/>
          <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
        </svg>
        Use approval password in app
      </button>
      <button type="button" class="btn btn-ghost" data-stk-approval-cancel>Cancel</button>
    </footer>
  </div>
</div>
